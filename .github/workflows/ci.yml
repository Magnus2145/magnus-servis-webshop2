name: CI

on:
  push:
    branches: [main, work]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --workspaces
      - name: Lint
        run: npm run lint --workspaces --if-present
      - name: Typecheck web
        run: npm run typecheck --workspace @magnus/web
      - name: Typecheck api
        run: npm run typecheck --workspace @magnus/api
      - name: Build web
        run: npm run build --workspace @magnus/web
      - name: Build api
        run: npm run build --workspace @magnus/api
      - name: Build cms
        run: npm run build --workspace @magnus/cms
      - name: Test api
        run: npm run test --workspace @magnus/api --if-present
